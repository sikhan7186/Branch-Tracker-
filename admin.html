<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Branch Tracker — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --green-deep:#084C37; --green:#0B6E4F; --green-soft:#E7F2EC;
  --gold:#C89B3C; --gold-soft:#F6ECD6; --bg:#F7F5F0; --card:#FFFFFF;
  --ink:#1B2B22; --ink-soft:#5B6B60; --line:#E4E0D6;
  --danger:#C0392B; --danger-soft:#FBEAE8; --ok:#1E8449;
  --radius:14px; --shadow:0 2px 10px rgba(11,110,79,0.08),0 1px 2px rgba(11,110,79,0.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
h1,.brand{font-family:'Tiro Bangla',serif;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select{font-family:inherit;}
code,.mono{font-family:'Roboto Mono',monospace;}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 10%, #0d7a56 0%, var(--green-deep) 55%, #052e21 100%);padding:24px;}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:36px 28px 28px;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);text-align:center;}
.login-card h1{font-size:20px;color:var(--green-deep);margin-bottom:4px;}
.login-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:24px;}
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:14.5px;background:#FCFBF8;}
.field input:focus,.field select:focus{outline:none;border-color:var(--green);background:#fff;}
.btn-primary{width:100%;padding:13px;border-radius:11px;background:var(--green-deep);color:#fff;font-size:14.5px;font-weight:600;}
.btn-primary:active{background:var(--green);}
.login-err{color:var(--danger);font-size:13px;margin-top:12px;min-height:16px;}

#app{display:none;min-height:100vh;}
header.topbar{position:sticky;top:0;z-index:20;background:var(--green-deep);color:#fff;
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.topbar .title{font-family:'Tiro Bangla',serif;font-size:17px;}
.topbar .title span{display:block;font-family:'Hind Siliguri',sans-serif;font-size:10.5px;color:var(--gold-soft);opacity:.85;font-weight:400;}
.icon-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.12);color:#fff;display:flex;align-items:center;justify-content:center;}

main{max-width:880px;margin:0 auto;padding:16px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar select{flex:1;min-width:180px;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--green-deep);}
.btn-sm{padding:10px 14px;border-radius:10px;background:var(--green-deep);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;}
.btn-sm:active{background:var(--green);}
.btn-outline{padding:10px 14px;border-radius:10px;border:1.5px solid var(--green-deep);color:var(--green-deep);font-size:13px;font-weight:600;background:#fff;}
.btn-outline.danger{border-color:var(--danger);color:var(--danger);}

.notice{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#6b511c;margin-bottom:16px;line-height:1.6;}
.access-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin:40px auto;max-width:480px;text-align:center;}
.access-card .uid{background:var(--bg);border-radius:10px;padding:10px;font-size:12px;word-break:break-all;margin:14px 0;border:1px solid var(--line);}

.tree{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;}
.node{border-radius:10px;}
.node-row{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:9px;}
.node-row:hover{background:var(--green-soft);}
.node-children{margin-left:20px;padding-left:10px;border-left:2px dashed var(--line);}
.toggle{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;border-radius:5px;}
.toggle.leaf{visibility:hidden;}
.key{font-weight:700;font-size:13.5px;color:var(--green-deep);white-space:nowrap;}
.type-badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:20px;background:var(--gold-soft);color:#8a6a1f;text-transform:uppercase;letter-spacing:.3px;}
.val-display{flex:1;font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-actions{display:flex;gap:4px;flex-shrink:0;}
.mini-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-soft);}
.mini-btn:hover{background:#fff;}
.mini-btn.edit{color:var(--green-deep);}
.mini-btn.del{color:var(--danger);}
.mini-btn.add{color:var(--ok);}

.inline-edit{display:flex;gap:6px;flex:1;align-items:center;}
.inline-edit input,.inline-edit select{flex:1;padding:7px 9px;border:1.5px solid var(--green);border-radius:8px;font-size:13px;}
.inline-edit .mini-btn{background:var(--green-deep);color:#fff;}
.inline-edit .mini-btn.cancel{background:var(--danger-soft);color:var(--danger);}

.add-form{background:var(--bg);border-radius:10px;padding:10px;margin:6px 0 6px 20px;border:1px dashed var(--line);}
.add-form .row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
.add-form input,.add-form select{padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
.add-form input[name=k]{flex:1;min-width:110px;}
.add-form input[name=v]{flex:1;min-width:110px;}
.add-form .actions{display:flex;gap:6px;justify-content:flex-end;}

.empty{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green-deep);color:#fff;
  padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,0.2);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.toast.err{background:var(--danger);}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Branch Tracker — Admin</h1>
    <div class="login-sub">শুধুমাত্র অনুমোদিত অ্যাডমিনদের জন্য</div>
    <div class="field"><label>ইমেইল</label><input type="email" id="loginEmail" placeholder="you@example.com"></div>
    <div class="field"><label>পাসওয়ার্ড</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <button class="btn-primary" id="loginBtn">লগইন করুন</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="title">Branch Tracker<span>Admin Panel</span></div>
    <button class="icon-btn" id="logoutBtn" title="লগ আউট">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </header>
  <main>
    <div class="notice">এখান থেকে যেকোনো ব্রাঞ্চের যেকোনো ফিল্ড এডিট, ডিলিট বা নতুন ফিল্ড যোগ করা যাবে। পরিবর্তন সরাসরি ডাটাবেজে সংরক্ষণ হয় — সতর্কতার সাথে ব্যবহার করুন।</div>
    <div class="toolbar">
      <select id="branchSelect"></select>
      <button class="btn-outline" id="refreshBtn">রিফ্রেশ</button>
      <button class="btn-sm" id="addRootFieldBtn">+ নতুন ফিল্ড</button>
    </div>
    <div id="addRootFormWrap"></div>
    <div class="tree" id="treeRoot"><div class="empty">একটি ব্রাঞ্চ নির্বাচন করুন</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============== একই Firebase প্রজেক্ট কনফিগ (branch-tracker.html এর সাথে মিল রেখে) ============== */
const firebaseConfig = {
  apiKey: "AIzaSyDEZwwgEu67UakVBfin1w1pUeR7kLKgurw",
  authDomain: "branch-tracker-d41b5.firebaseapp.com",
  databaseURL: "https://branch-tracker-d41b5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "branch-tracker-d41b5",
  storageBucket: "branch-tracker-d41b5.firebasestorage.app",
  messagingSenderId: "28831748477",
  appId: "1:28831748477:web:1ea73a16dc9db1caa23c14"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

function showToast(msg, isErr){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.className='toast show'+(isErr?' err':'');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function safeKey(k){ return k.replace(/[.#$\/\[\]]/g,'_'); }

/* ---------- AUTH + ADMIN CHECK ---------- */
document.getElementById('loginBtn').onclick=async()=>{
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!email||!pass){ errEl.textContent='ইমেইল ও পাসওয়ার্ড দিন'; return; }
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ errEl.textContent='লগইন ব্যর্থ — ইমেইল বা পাসওয়ার্ড ভুল'; }
};
document.getElementById('logoutBtn').onclick=()=>auth.signOut();

auth.onAuthStateChanged(async user=>{
  if(!user){
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('app').style.display='none';
    return;
  }
  const adminSnap = await db.ref(`admins/${user.uid}`).once('value');
  document.getElementById('loginScreen').style.display='none';
  if(adminSnap.val()===true){
    document.getElementById('app').style.display='block';
    initAdmin();
  }else{
    document.getElementById('app').style.display='block';
    document.querySelector('main').innerHTML = `
      <div class="access-card">
        <h1 style="color:var(--danger);font-size:18px;">অ্যাক্সেস নেই</h1>
        <p style="font-size:13.5px;color:var(--ink-soft);margin-top:8px;">আপনার অ্যাকাউন্টটি অ্যাডমিন হিসেবে অনুমোদিত নয়। Firebase Console → Realtime Database এ গিয়ে নিচের UID টি <code class="mono">admins/&lt;UID&gt; : true</code> হিসেবে যোগ করুন।</p>
        <div class="uid mono">${user.uid}</div>
      </div>`;
  }
});

/* ---------- ADMIN APP ---------- */
let currentBranchId=null;
let currentData=null;
const expandedPaths=new Set();
let pendingAddAt=null; // path where an add-form should auto-open after next render

function initAdmin(){
  loadBranchList();
  document.getElementById('refreshBtn').onclick=()=>{ if(currentBranchId) loadBranchData(currentBranchId); };
  document.getElementById('branchSelect').onchange=(e)=>{
    currentBranchId=e.target.value;
    expandedPaths.clear();
    if(currentBranchId) loadBranchData(currentBranchId);
  };
  document.getElementById('addRootFieldBtn').onclick=()=>{
    if(!currentBranchId){ showToast('আগে একটি ব্রাঞ্চ নির্বাচন করুন', true); return; }
    const wrap=document.getElementById('addRootFormWrap');
    wrap.innerHTML='';
    wrap.appendChild(makeAddForm(`branches/${currentBranchId}`, ()=>{ wrap.innerHTML=''; loadBranchData(currentBranchId); }));
  };
}

async function loadBranchList(){
  const sel=document.getElementById('branchSelect');
  sel.innerHTML='<option value="">লোড হচ্ছে...</option>';
  const snap=await db.ref('branches').once('value');
  const data=snap.val()||{};
  const ids=Object.keys(data);
  if(!ids.length){ sel.innerHTML='<option value="">কোনো ব্রাঞ্চ পাওয়া যায়নি</option>'; return; }
  sel.innerHTML='<option value="">-- ব্রাঞ্চ নির্বাচন করুন --</option>';
  ids.forEach(id=>{
    const name=(data[id].info && data[id].info.name) ? data[id].info.name : id;
    const opt=document.createElement('option'); opt.value=id; opt.textContent=`${name}`;
    sel.appendChild(opt);
  });
}

async function loadBranchData(uid){
  document.getElementById('treeRoot').innerHTML='<div class="empty">লোড হচ্ছে...</div>';
  const snap=await db.ref(`branches/${uid}`).once('value');
  currentData=snap.val()||{};
  renderTree();
}

function renderTree(){
  const root=document.getElementById('treeRoot');
  root.innerHTML='';
  if(currentData===null || (typeof currentData==='object' && Object.keys(currentData).length===0)){
    root.innerHTML='<div class="empty">এই ব্রাঞ্চে এখনো কোনো ডাটা নেই। "নতুন ফিল্ড" চেপে শুরু করুন।</div>';
    return;
  }
  const container=buildNodeChildren(`branches/${currentBranchId}`, currentData);
  root.appendChild(container);
  if(pendingAddAt){
    const holder=root.querySelector(`[data-holder-path="${cssEscape(pendingAddAt)}"]`);
    if(holder){
      const form=makeAddForm(pendingAddAt, ()=>loadBranchData(currentBranchId));
      holder.insertBefore(form, holder.firstChild);
    }
    pendingAddAt=null;
  }
}
function cssEscape(s){ return s.replace(/[^a-zA-Z0-9_-]/g, c=>'\\'+c); }

function typeOf(v){
  if(v===null||v===undefined) return 'null';
  if(Array.isArray(v)) return 'array';
  if(typeof v==='object') return 'object';
  if(typeof v==='number') return 'number';
  if(typeof v==='boolean') return 'boolean';
  return 'text';
}

function buildNodeChildren(basePath, obj){
  const wrap=document.createElement('div');
  Object.keys(obj).sort().forEach(key=>{
    wrap.appendChild(buildNode(basePath, key, obj[key]));
  });
  return wrap;
}

function buildNode(basePath, key, value){
  const path=`${basePath}/${key}`;
  const t=typeOf(value);
  const nodeDiv=document.createElement('div'); nodeDiv.className='node';

  const row=document.createElement('div'); row.className='node-row';

  const isExpandable = (t==='object'||t==='array');
  const toggleBtn=document.createElement('button');
  toggleBtn.className='toggle'+(isExpandable?'':' leaf');
  toggleBtn.textContent = isExpandable ? (expandedPaths.has(path)?'▼':'▶') : '';
  if(isExpandable){
    toggleBtn.onclick=()=>{
      if(expandedPaths.has(path)) expandedPaths.delete(path); else expandedPaths.add(path);
      renderTree();
    };
  }
  row.appendChild(toggleBtn);

  const keyEl=document.createElement('span'); keyEl.className='key'; keyEl.textContent=key;
  row.appendChild(keyEl);

  const badge=document.createElement('span'); badge.className='type-badge'; badge.textContent=t;
  row.appendChild(badge);

  const valDisplay=document.createElement('span'); valDisplay.className='val-display';
  if(!isExpandable){
    valDisplay.textContent = t==='null' ? '(খালি)' : String(value);
  } else {
    const count = Array.isArray(value) ? value.length : Object.keys(value||{}).length;
    valDisplay.textContent = `${count} টি আইটেম`;
    valDisplay.style.color='var(--ink-soft)';
  }
  row.appendChild(valDisplay);

  const actions=document.createElement('div'); actions.className='row-actions';

  if(!isExpandable){
    const editBtn=document.createElement('button'); editBtn.className='mini-btn edit'; editBtn.innerHTML='✎';
    editBtn.onclick=()=>startInlineEdit(row, path, value, valDisplay, actions);
    actions.appendChild(editBtn);
  } else {
    const addBtn=document.createElement('button'); addBtn.className='mini-btn add'; addBtn.innerHTML='+';
    addBtn.title='সাব-ফিল্ড যোগ করুন';
    addBtn.onclick=()=>{
      expandedPaths.add(path);
      pendingAddAt=path;
      renderTree();
    };
    actions.appendChild(addBtn);
  }

  const delBtn=document.createElement('button'); delBtn.className='mini-btn del'; delBtn.innerHTML='🗑';
  delBtn.title='ডিলিট করুন';
  delBtn.onclick=async()=>{
    if(!confirm(`"${key}" ফিল্ডটি স্থায়ীভাবে মুছে ফেলতে চান?`)) return;
    try{ await db.ref(path).remove(); showToast('ডিলিট হয়েছে'); loadBranchData(currentBranchId); }
    catch(e){ showToast('ডিলিট ব্যর্থ: '+e.message, true); }
  };
  actions.appendChild(delBtn);

  row.appendChild(actions);
  nodeDiv.appendChild(row);

  const childHolder=document.createElement('div');
  nodeDiv.appendChild(childHolder);

  if(isExpandable && expandedPaths.has(path)){
    const childWrap=document.createElement('div'); childWrap.className='node-children';
    childWrap.setAttribute('data-holder-path', path);
    const childObj = value || {};
    const keys=Object.keys(childObj);
    if(!keys.length){
      const emp=document.createElement('div'); emp.className='empty'; emp.style.padding='10px';
      emp.textContent='খালি — "+" চেপে সাব-ফিল্ড যোগ করুন';
      childWrap.appendChild(emp);
    } else {
      keys.sort().forEach(ck=>{ childWrap.appendChild(buildNode(path, ck, childObj[ck])); });
    }
    childHolder.appendChild(childWrap);
  }

  return nodeDiv;
}

function startInlineEdit(row, path, value, valDisplay, actionsEl){
  const t=typeOf(value);
  const editWrap=document.createElement('div'); editWrap.className='inline-edit';
  let input;
  if(t==='boolean'){
    input=document.createElement('select');
    ['true','false'].forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v; input.appendChild(o); });
    input.value=String(value);
  } else {
    input=document.createElement('input');
    input.type = t==='number' ? 'number' : 'text';
    input.value = t==='null' ? '' : value;
  }
  editWrap.appendChild(input);

  const saveBtn=document.createElement('button'); saveBtn.className='mini-btn'; saveBtn.innerHTML='✓';
  saveBtn.onclick=async()=>{
    let newVal = input.value;
    if(t==='number'){ newVal = newVal===''? 0 : Number(newVal); }
    else if(t==='boolean'){ newVal = newVal==='true'; }
    try{ await db.ref(path).set(newVal); showToast('সংরক্ষণ হয়েছে'); loadBranchData(currentBranchId); }
    catch(e){ showToast('সংরক্ষণ ব্যর্থ: '+e.message, true); }
  };
  const cancelBtn=document.createElement('button'); cancelBtn.className='mini-btn cancel'; cancelBtn.innerHTML='✕';
  cancelBtn.onclick=()=>renderTree();
  editWrap.appendChild(saveBtn); editWrap.appendChild(cancelBtn);

  valDisplay.replaceWith(editWrap);
  actionsEl.style.display='none';
  input.focus();
}

/* Builds a reusable "add field" inline form element for a given parent path */
function makeAddForm(parentPath, onSaved){
  const form=document.createElement('div'); form.className='add-form';
  form.innerHTML=`
    <div class="row">
      <input name="k" type="text" placeholder="ফিল্ডের নাম (key)">
      <select name="t">
        <option value="text">টেক্সট</option>
        <option value="number">সংখ্যা</option>
        <option value="boolean">হ্যাঁ/না</option>
        <option value="object">অবজেক্ট (সাব-ফিল্ড রাখার জন্য)</option>
      </select>
    </div>
    <div class="row" data-vwrap>
      <input name="v" type="text" placeholder="মান (value)">
    </div>
    <div class="actions">
      <button class="btn-outline" data-act="cancel" type="button">বাতিল</button>
      <button class="btn-sm" data-act="save" type="button">যোগ করুন</button>
    </div>`;
  const typeSel=form.querySelector('select[name=t]');
  const vwrap=form.querySelector('[data-vwrap]');
  typeSel.onchange=()=>{
    vwrap.style.display = typeSel.value==='object' ? 'none' : 'flex';
  };
  form.querySelector('[data-act="cancel"]').onclick=()=>form.remove();
  form.querySelector('[data-act="save"]').onclick=async()=>{
    const kRaw=form.querySelector('input[name=k]').value.trim();
    if(!kRaw){ showToast('ফিল্ডের নাম দিন', true); return; }
    const key=safeKey(kRaw);
    const type=typeSel.value;
    let val;
    if(type==='object'){ val={ _placeholder: true }; }
    else if(type==='number'){ val=Number(form.querySelector('input[name=v]').value)||0; }
    else if(type==='boolean'){ val = form.querySelector('input[name=v]').value.trim().toLowerCase()==='true'; }
    else { val = form.querySelector('input[name=v]').value; }
    try{
      await db.ref(`${parentPath}/${key}`).set(val);
      showToast('নতুন ফিল্ড যোগ হয়েছে');
      onSaved();
    }catch(e){ showToast('যোগ করা ব্যর্থ: '+e.message, true); }
  };
  return form;
}
</script>
</body>
</html>
